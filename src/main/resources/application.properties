poc.application.topic-name = telemetries
poc.application.number-of-partition = 3
poc.application.number-of-replica = 1
poc.application.consumer-group-id = telemetries_consumer_id

spring.kafka.template.default-topic = telemetries

spring.kafka.properties.schema.registry.url = http://localhost:8081
spring.kafka.properties.auto.register.schemas = false
spring.kafka.properties.use.latest.version = true
spring.kafka.properties.json.fail.invalid.schema = true
spring.kafka.properties.json.schema.spec.version = draft_7
spring.kafka.properties.json.oneof.for.nullables = false
spring.kafka.properties.json.write.dates.iso8601 = true

spring.kafka.producer.bootstrap-servers = localhost:9092,localhost:9101
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = io.confluent.kafka.serializers.json.KafkaJsonSchemaSerializer
spring.kafka.producer.properties.acks = all
spring.kafka.producer.properties.retries = 10
spring.kafka.producer.properties.retry.backoff.ms = 1000

spring.kafka.admin.properties.bootstrap-servers = localhost:9092,localhost:9101

spring.kafka.consumer.bootstrap-servers = localhost:9092,localhost:9101
spring.kafka.consumer.group-id = group_id
spring.kafka.consumer.auto-offset-reset = latest
spring.kafka.consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer = io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
spring.kafka.consumer.properties.schema.registry.url = http://localhost:8081
spring.kafka.consumer.properties.json.value.type = com.playpen.kafkaJsonDemo.entity.Telemetry
spring.kafka.consumer.properties.json.key.type = java.lang.String
